name: sumberkerto_smart_village
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  connectivity_plus: ^7.0.0
  firebase_auth: ^6.1.3
  firebase_core: ^4.3.0
  firebase_database: ^12.1.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_screenutil: ^5.9.3
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  get: ^4.7.3
  get_storage: ^2.1.1
  google_fonts: ^7.0.0
  google_maps_flutter: ^2.14.0
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  logger: ^2.6.2
  lottie: ^3.3.2
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/images/
    - assets/lottie/

    - .env
